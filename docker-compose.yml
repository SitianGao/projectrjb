services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/runtime/eduagent.db
      CHROMA_PERSIST_DIR: /app/runtime/chroma_data
      SEED_DEMO_DATA: "true"
      LLM_PRIMARY: ${LLM_PRIMARY:-spark}
      SPARK_ENABLED: ${SPARK_ENABLED:-true}
      SPARK_PROTOCOL: ${SPARK_PROTOCOL:-http}
      SPARK_API_PASSWORD: ${SPARK_API_PASSWORD:-}
      SPARK_BASE_URL: ${SPARK_BASE_URL:-https://spark-api-open.xf-yun.com/x2/}
      SPARK_API_URL: ${SPARK_API_URL:-https://spark-api-open.xf-yun.com/x2/chat/completions}
      SPARK_MODEL: ${SPARK_MODEL:-spark-x}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      OPENMAIC_CLASSROOM_SERVICE_URL: ${OPENMAIC_CLASSROOM_SERVICE_URL:-http://openmaic-classroom:3200}
    ports:
      - "8000:8000"
    volumes:
      - backend-runtime:/app/runtime

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend-runtime:
